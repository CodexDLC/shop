[project]
name = "inet-mag"
version = "0.1.0"
description = "Django shop, independent commerce engine and ARQ worker"
requires-python = ">=3.13,<3.14"
dependencies = ["codex-core==0.5.0"]

[dependency-groups]
web = [
  "Django==6.1.2", "codex-django==0.7.0", "psycopg[binary]==3.3.6",
  "django-storages[s3]==1.14.6", "Pillow==12.3.0", "gunicorn>=23,<24",
]
worker = ["codex-platform[arq]==0.6.0", "arq==0.28.0"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-django>=4.11,<5", "ruff>=0.14,<1", "codex-django-cli==0.4.0"]

[tool.uv]
default-groups = ["web", "worker", "dev"]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "web.config.settings.test"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
