name: inet-mag
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: inet_mag
      POSTGRES_USER: inet_mag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inet_mag -d inet_mag"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  web:
    build: {context: .., dockerfile: deploy/web/Dockerfile}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_SETTINGS_MODULE: web.config.settings.local
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      INVENTORY_EXPIRY_ENABLED: ${INVENTORY_EXPIRY_ENABLED:-0}
      INVENTORY_EXPIRY_TOKEN: ${INVENTORY_EXPIRY_TOKEN:-}
      INVENTORY_EXPIRY_ACTOR_ID: ${INVENTORY_EXPIRY_ACTOR_ID:-}
      INVENTORY_EXPIRY_BATCH_SIZE: ${INVENTORY_EXPIRY_BATCH_SIZE:-100}
      SHOP_CHECKOUT_STOCK_MODE: ${SHOP_CHECKOUT_STOCK_MODE:-demo}
      SHOP_CHECKOUT_RESERVATION_TTL_SECONDS: ${SHOP_CHECKOUT_RESERVATION_TTL_SECONDS:-1800}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: {context: .., dockerfile: deploy/worker/Dockerfile}
    environment:
      REDIS_URL: "redis://redis:6379/0"
      INVENTORY_EXPIRY_ENABLED: ${INVENTORY_EXPIRY_ENABLED:-0}
      INVENTORY_EXPIRY_TOKEN: ${INVENTORY_EXPIRY_TOKEN:-}
      INVENTORY_EXPIRY_URL: ${INVENTORY_EXPIRY_URL:-http://web:8000/internal/inventory/expiry/}
    depends_on:
      redis: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
