# Temporary HTTP-only vhost to obtain the first certificate. Use INSTEAD OF shop.conf.
server {
    listen 80;
    server_name shop.pinlite.dev;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/shop-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
