# Host Nginx only. Install as /etc/nginx/sites-available/shop and enable that file.
# Do not replace nginx.conf or the existing DLC vhost.
limit_req_zone $binary_remote_addr zone=shop_ebay_notifications:1m rate=1r/s;
server {
    listen 80;
    server_name shop.pinlite.dev;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    access_log /var/log/nginx/shop-access.log;
    error_log /var/log/nginx/shop-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/shop-acme;
        auth_basic off;
        try_files $uri =404;
    }
    location ~ ^/(?:ru/)?accounts/ {
        access_log off;
        error_log /dev/null;
        return 301 https://shop.pinlite.dev$request_uri;
    }
    location = /integrations/ebay/account-deletion/ {
        access_log off;
        error_log /dev/null;
        return 301 https://shop.pinlite.dev$request_uri;
    }
    location / { return 301 https://shop.pinlite.dev$request_uri; }
    location ^~ /integrations/ebay/oauth/ {
        access_log off;
        error_log /dev/null;
        return 301 https://shop.pinlite.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shop.pinlite.dev;
    ssl_certificate /etc/letsencrypt/live/shop.pinlite.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.pinlite.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:shop_tls:1m;
    ssl_session_timeout 1d;

    auth_basic "Shop test environment";
    auth_basic_user_file /srv/shop/shared/htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    access_log /var/log/nginx/shop-access.log;
    error_log /var/log/nginx/shop-error.log warn;
    client_max_body_size 2m;

    # This location alone is public; Django verifies the eBay signature before accepting POSTs.
    location = /integrations/ebay/account-deletion/ {
        auth_basic off;
        limit_req zone=shop_ebay_notifications burst=5 nodelay;
        limit_req_status 429;
        access_log off;
        # Nginx error logs can contain request URIs, including challenge query strings.
        error_log /dev/null;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host shop.pinlite.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    # Capture account URLs before the general proxy, avoiding reset/confirmation tokens in logs.
    # Public invitation/callback only: application requires invitation, CSRF and bound OAuth state.
    location ^~ /integrations/ebay/oauth/ {
        auth_basic off;
        limit_req zone=shop_ebay_notifications burst=10 nodelay;
        limit_req_status 429;
        access_log off;
        error_log /dev/null;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host shop.pinlite.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }
    location ~ ^/(?:ru/)?accounts/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host shop.pinlite.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location ^~ /static/ {
        alias /var/www/shop-static/;
        autoindex off;
        expires 1h;
    }
    # Private uploads have no public-serving policy in this first staging release.
    location ^~ /media/ { return 404; }
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host shop.pinlite.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
