{% load shop_i18n %}<div class="flex flex-col gap-1.5"><label for="{{ field.id_for_label }}" class="font-label-md text-label-md uppercase tracking-wider">{% text label %} *</label><input id="{{ field.id_for_label }}" name="{{ field.name }}" value="{{ field.value|default_if_none:'' }}" type="text" maxlength="{{ field.field.max_length }}" {% if numeric %}inputmode="numeric"{% endif %} class="w-full bg-surface-container-lowest text-text-primary px-4 py-3 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-primary" {% if field.errors %}aria-invalid="true" aria-describedby="error-{{ field.name }}"{% endif %}>{% if field.errors %}<p id="error-{{ field.name }}" role="alert" class="font-body-sm text-body-sm text-error">{% text 'commerce.error.address' %}</p>{% endif %}</div>
