{% load shop_i18n %}
<fieldset class="flex flex-col gap-2.5 pt-space-xs"><legend class="font-label-sm text-label-sm uppercase tracking-wider text-text-muted font-semibold mb-2">{% text title %}</legend>
<div class="{% if name == 'color' %}catalog-color-filters grid grid-cols-2 gap-2{% elif tiles %}flex flex-wrap gap-1.5{% else %}flex flex-col gap-2{% endif %}">
{% for option in options %}<label class="flex items-center gap-2.5 cursor-pointer {% if name == 'color' %}catalog-color-filter bg-surface-container-lowest p-1.5 text-left {% if option.selected %}ring-2 ring-brand-deep{% endif %}{% elif tiles %}bg-surface-container-lowest px-2 py-2{% endif %}"><input form="catalog-filters" type="checkbox" name="{{ name }}" value="{{ option.value }}" {% if option.selected %}checked{% endif %} class="{% if name == 'color' %}sr-only{% else %}w-4 h-4 accent-brand-deep rounded-none{% endif %}">{% if option.hex %}<span class="w-4 h-4 border border-border-subtle" style="background-color:{{ option.hex }}" aria-hidden="true"></span>{% endif %}<span class="font-body-md text-body-md">{{ option.label }}</span></label>{% empty %}<span class="text-body-sm text-text-muted">{% text 'catalog.listing.no_options' %}</span>{% endfor %}
</div></fieldset>
