{% load static shop_i18n i18n %}
{% get_current_language as current_language %}
<!doctype html>
<html lang="{{ current_language }}" class="h-full scroll-smooth">
<head>
{{ shop_texts|json_script:'shop-texts' }}
<script src="{% static 'storefront/localization.js' %}"></script>
{% block page_head %}{% endblock %}
<link rel="stylesheet" href="{% static 'storefront/django-preview.css' %}">
</head>
<body {% block body_attrs %}{% endblock %}>
{% block content %}{% endblock %}
{% if demo_mode %}<aside class="shop-demo-notice" role="note">{% text 'demo.notice' %}</aside>{% endif %}
{{ shop_routes|json_script:'shop-routes' }}
<script src="{% static 'storefront/reference-navigation.js' %}"></script>
<script src="{% static 'storefront/django-preview.js' %}"></script>
</body></html>
