{% load shop_i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'de' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block subject %}{% endblock %}</title></head>
<body style="margin:0;padding:0;background:#F8F8F3;color:#171E19;font-family:Arial,Helvetica,sans-serif;">
<div style="display:none;max-height:0;overflow:hidden;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F8F8F3;"><tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;border:1px solid #DCDED5;">
<tr><td style="background:#183F30;padding:28px 24px;text-align:center;"><img src="cid:maennermasche-logo" alt="Männermasche — Herrenunterwäsche &amp; Bademode" width="260" style="display:block;width:100%;max-width:260px;height:auto;margin:0 auto;border:0;"></td></tr>
<tr><td style="background:#FFFFFF;padding:32px 24px;font-size:16px;line-height:1.65;">
<p style="margin:0 0 12px;font-size:11px;letter-spacing:2px;color:#626960;text-transform:uppercase;">{% text 'email.account.eyebrow' %}</p>
<h1 style="margin:0 0 24px;font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.3;font-weight:400;color:#183F30;">{% block heading %}{% endblock %}</h1>
{% block content %}{% endblock %}
<p style="margin:28px 0 0;color:#626960;font-size:13px;line-height:1.6;">{% block safety %}{% endblock %}</p>
</td></tr><tr><td style="background:#EEEEE7;padding:24px;text-align:center;color:#626960;font-size:12px;line-height:1.6;">Männermasche<br>{% text 'email.account.footer' %}</td></tr>
</table></td></tr></table></body></html>
